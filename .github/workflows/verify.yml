name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: canonical manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest, repository drift rules and Doctor contracts
        run: python3 tools/validate-realmheart-manifest.py

  installer-doctor-tests:
    name: installer + doctor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer, Doctor, forensics and acceptance test suite
        run: PYTHONPATH=installer:. python3 -m unittest discover -s tests/installer -t .

# The native GTK4/Wayland suite is intentionally not wired here: it needs
# gtk4-layer-shell and a Wayland/EGL stack that stock runners do not provide.
# Run it locally with:
#   cmake -S . -B build-hybrid -G Ninja -DBUILD_TESTING=ON
#   cmake --build build-hybrid -j"$(nproc)"
#   ctest --test-dir build-hybrid --output-on-failure
