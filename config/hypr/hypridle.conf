# The installer materializes this executable with the exact binary used by the
# running Realmheart service. Native Broken Seal owns hyprland-lock-notify-v1
# readiness; fallback ownership stays inside the running Realmheart shell.
$lock_cmd = $HOME/.local/bin/realmheart-lock-session
$suspend_cmd = $HOME/.local/bin/realmheart-lock-session --suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = hyprctl dispatch dpms on
    # Native Broken Seal owns hyprland-lock-notify-v1 readiness.
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = $lock_cmd
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
