schema_version = 1
release_version = "0.7.8"

[[components]]
id = "realmheart-core"
name = "Realmheart Core"
component_version = "release"
category = "core"
stage = "core_shell"
description = "Main native shell and shared release resources."
repair_strategy_ids = ["rebuild_component", "install_missing_package", "restart_service"]
build_units = ["realmheart-shell", "power-menu-renderer"]
[[components.log_sources]]
kind = "journal"
target = "realmheart.service"

[[components]]
id = "realmheart-fx"
name = "Realmheart FX"
component_version = "release"
category = "fx"
stage = "core_shell"
description = "Required Hyprland compositor-side rendering plugin."
build_units = ["realmheart-fx"]
repair_strategy_ids = ["rebuild_component", "install_missing_package"]
[[components.realmheart_dependencies]]
id = "realmheart-core"
required = true

